<style>
:root{
  color-scheme: dark;
  --bg:#282826; --bg-2:#302f2c; --bg-3:#363531; --line:#45433f; --line-soft:#383734;
  --ink:#F6F3EE; --ink-2:#BDB5B1; --ink-3:#8f8a85;
  --gold:#B39262; --gold-ink:#c9ab7d; --gold-wash:rgba(179,146,98,.14);
  --warn:#d9826b; --warn-wash:rgba(217,130,107,.12); --ok:#8fae84; --mid:#c9ab7d;
  --serif:'Icone LT', Georgia, 'Times New Roman', serif;
  --sans:'PP Neue Montreal','Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#F6F3EE; --bg-2:#EEE9E1; --bg-3:#E6E0D6; --line:#d6cfc8; --line-soft:#e4ded6;
    --ink:#282826; --ink-2:#55524e; --ink-3:#6B6967;
    --gold:#9a7a4c; --gold-ink:#86683c; --gold-wash:rgba(179,146,98,.16);
    --warn:#a8513b; --warn-wash:rgba(168,81,59,.09); --ok:#4f7445; --mid:#86683c;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#F6F3EE; --bg-2:#EEE9E1; --bg-3:#E6E0D6; --line:#d6cfc8; --line-soft:#e4ded6;
  --ink:#282826; --ink-2:#55524e; --ink-3:#6B6967;
  --gold:#9a7a4c; --gold-ink:#86683c; --gold-wash:rgba(179,146,98,.16);
  --warn:#a8513b; --warn-wash:rgba(168,81,59,.09); --ok:#4f7445; --mid:#86683c;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:0 56px}

/* Masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:26px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none}
.brand img{width:44px;height:auto;display:block}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(28px,4vw,40px);letter-spacing:.02em;line-height:1.05;margin:2px 0 0}
h1 em{font-style:italic;color:var(--gold-ink)}
.status{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.status b{color:var(--ink);font-weight:500}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.pulse.off{background:var(--warn)}
nav.tabs-scroll{overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs{display:flex;gap:2px;min-width:max-content}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);font-size:14px;padding:10px 12px 9px;cursor:pointer;margin-bottom:-1px;white-space:nowrap;text-decoration:none}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:500}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:4px}

/* Typography */
h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0;text-wrap:balance}
.page-head{padding-block:28px 6px}
.page-head h2{font-size:clamp(26px,3.4vw,34px);font-weight:300}
.crumbs{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--gold-ink)}
.lede{font-size:16px;color:var(--ink);max-width:72ch;margin:12px 0 0}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.mono{font-family:var(--mono)}
section.blk{margin-top:36px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding-bottom:8px}
.sec-note{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
@media (max-width:960px){.grid2{grid-template-columns:1fr;gap:28px}}
aside.side{display:flex;flex-direction:column;gap:30px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink-3);white-space:nowrap}
.badge.gold{border-color:var(--gold);color:var(--gold-ink)}
.badge.solid{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.ia::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--ink-2);cursor:pointer;text-decoration:none;white-space:nowrap}
.chip:hover{border-color:var(--gold);color:var(--ink)}
.chip.p{border-style:dashed}
.chip.c{border-style:dotted}
.chip[aria-pressed="true"]{background:var(--gold-wash);border-color:var(--gold);color:var(--ink)}
.chip.dis{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ref{color:var(--gold-ink);text-decoration:none;border-bottom:1px solid transparent}
.ref:hover{border-bottom-color:var(--gold)}

/* Search */
.hero{padding-block:44px 8px;max-width:820px}
.hero h2{font-size:clamp(28px,4vw,40px);font-weight:300;line-height:1.15}
.hero p{color:var(--ink-2);margin:10px 0 0;max-width:62ch}
form.search{margin-top:22px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:6px;padding:4px 6px 4px 14px;background:var(--bg-2)}
form.search:focus-within{border-color:var(--gold)}
form.search input{flex:1;min-width:0;background:none;border:0;font-size:16px;padding:11px 0;outline:none}
form.search svg{flex:none;color:var(--ink-3)}
.btn{appearance:none;text-decoration:none;display:inline-block;border:1px solid var(--gold);background:var(--gold);color:var(--bg);font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:none;color:var(--gold-ink)}
.btn.quiet{background:none;border-color:var(--line);color:var(--ink-2);font-weight:400}
.btn.quiet:hover{border-color:var(--gold);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
.examples{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.examples span{font-size:12px;color:var(--ink-3);margin-right:4px}

/* Home cards */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.area{padding:14px 16px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);text-decoration:none;display:flex;flex-direction:column;gap:3px}
.area:hover{background:var(--bg-2)}
.area b{font-weight:500;font-size:15px}
.area span{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.area.soon b{color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 0;text-decoration:none;align-items:baseline}
.row:hover .rt{color:var(--gold-ink)}
.rt{font-family:var(--serif);font-size:17.5px;line-height:1.3}
.rs{font-size:13px;color:var(--ink-2);margin-top:3px;max-width:78ch}
.rm{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

/* Legal text */
.lex{border-left:2px solid var(--gold);padding:4px 0 4px 18px;margin:0}
.lex p{margin:0 0 6px;max-width:78ch}
.lex p.cap{font-size:15.5px}
.lex p.sub{padding-left:18px;color:var(--ink)}
.lex .nt{display:block;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}
.lex .nt.new{color:var(--gold-ink)}
.srcline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-3)}
.srcline a{color:var(--gold-ink)}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line-soft)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;background:var(--bg-2)}
tr:last-child td{border-bottom:0}
td.k{color:var(--ink-3);white-space:nowrap}
.cmp td{min-width:220px}
.cmp td.k{min-width:140px}

/* Chain */
.chain{display:flex;flex-direction:column;gap:0;max-width:640px}
.link{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start;padding:10px 0}
.link .papel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.link .who{font-family:var(--serif);font-size:17px}
.link .desc{font-size:13px;color:var(--ink-2)}
.arrow{margin-left:164px;color:var(--gold);font-size:14px;line-height:1}
@media (max-width:560px){.link{grid-template-columns:1fr;gap:2px}.arrow{margin-left:0}}
.distinct{margin-top:12px;font-size:13px;color:var(--ink-2);max-width:72ch}

/* Alerts */
.alert{border:1px solid var(--warn);background:var(--warn-wash);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.alert .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--warn);text-transform:uppercase}
.alert h3{font-size:18px;margin:4px 0 6px}
.alert p{margin:6px 0 0;font-size:14px;max-width:78ch}
.alert .rep{color:var(--ink-2);font-size:13.5px}

/* Relations list */
.rel{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rel .l{display:flex;flex-direction:column;gap:6px}
.rel .l a{font-family:var(--serif);font-size:16.5px;text-decoration:none}
.rel .l a:hover{color:var(--gold-ink)}
.rel p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:72ch}
@media (max-width:560px){.rel{grid-template-columns:1fr}}

/* Map */
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg-2)}
.map-wrap svg{display:block;min-width:600px;width:100%;height:auto}
.map-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:8px}
.map-legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--gold);vertical-align:3px;margin-right:6px}
.map-legend i.c{border-top-style:dashed}.map-legend i.t{border-top-style:dotted;border-top-color:var(--ink-3)}.map-legend i.w{border-top-color:var(--warn);border-top-style:dotted}
svg .nd rect{fill:var(--bg);stroke:var(--line)}
svg .nd:hover rect{stroke:var(--gold)}
svg .nd.ctr rect{fill:var(--gold-wash);stroke:var(--gold)}
svg .nd text{fill:var(--ink);font-family:var(--sans);font-size:13px}
svg .nd text.s{fill:var(--ink-3);font-size:10.5px;font-family:var(--mono);letter-spacing:.04em}
svg .nd.ins rect{fill:none;stroke-dasharray:3 3}
svg .ed{fill:none;stroke:var(--gold);stroke-width:1.4}
svg .ed.conexo{stroke-dasharray:6 4}
svg .ed.contato{stroke:var(--ink-3);stroke-dasharray:2 4}
svg .ed.alerta{stroke:var(--warn);stroke-dasharray:2 4}
svg .el{fill:var(--ink-3);font-family:var(--mono);font-size:9.5px}
svg .col{fill:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.12em}

/* Precedents */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.prec{border-bottom:1px solid var(--line-soft);padding:14px 0}
.prec-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.prec h4{font-family:var(--serif);font-weight:400;font-size:18px;margin:0}
.prec h4 a{text-decoration:none}
.prec h4 a:hover{color:var(--gold-ink)}
.tese{margin:6px 0 0;font-size:14px;max-width:78ch;background:var(--bg-2);padding:9px 12px;border-radius:4px}
.tese span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:500;margin-right:8px}
.pmeta{font-size:12.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.pmeta a{color:var(--gold-ink)}
details.q summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);margin-top:6px}
details.q p{font-size:13.5px;color:var(--ink-2);max-width:78ch;margin:6px 0 0}

/* Timeline */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.step{position:relative;padding:0 0 16px 26px}
.step::before{content:"";position:absolute;left:0;top:6px;width:11px;height:11px;border-radius:50%;border:1px solid var(--ink-3);background:var(--bg)}
.step.now::before{background:var(--gold);border-color:var(--gold)}
.yr{font-family:var(--mono);font-size:12px;font-weight:500}
.step p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}

/* Controversies */
.contro{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.contro h3{font-size:17.5px;margin:0 0 8px}
.pos{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.pos b{font-family:var(--mono);font-size:12px;color:var(--gold-ink);font-weight:500}
.pred{margin-top:8px;font-size:13px;color:var(--ink-2)}
.pred strong{color:var(--ink);font-weight:500}

/* Practice */
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
@media (max-width:760px){.sides{grid-template-columns:1fr}}
.side-col h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin:0 0 6px}
.arg{padding:9px 0;border-top:1px solid var(--line-soft);font-size:14px}
.arg .chips{margin-top:6px}

/* Checklist */
.check{list-style:none;margin:0;padding:0}
.check li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.check input{width:17px;height:17px;accent-color:var(--gold);margin-top:3px}
.check label{font-size:14.5px;cursor:pointer}
.check .obs{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.check li.done label{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line)}

/* Notes */
.note{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.note .who{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note p{margin:4px 0 0;font-size:14px;white-space:pre-wrap;max-width:78ch}
form.nf{display:grid;gap:8px;margin-top:12px}
textarea,input[type=text],select{background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:9px 10px;font-size:14px;width:100%}
textarea{min-height:80px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{border-color:var(--gold);outline:none}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow > *{flex:1 1 180px}
.frow .btn{flex:0 0 auto}

/* Actions bar */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.pop{position:relative}
.menu{position:absolute;z-index:5;top:calc(100% + 6px);left:0;min-width:240px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:4px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:var(--bg-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:13.5px;z-index:20}

/* AI card */
.ai{border:1px solid var(--gold);border-radius:6px;padding:16px 18px;background:var(--gold-wash);margin-top:18px}
.ai .lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.ai p{margin:6px 0 0;max-width:78ch}
.think{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}

.side-box h3{font-size:17px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.empty{padding:22px 0;color:var(--ink-3);font-size:14px}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.foot p{margin:0;max-width:74ch}
.theme-btn{background:none;border:1px solid var(--line);color:var(--ink-2);font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;align-self:flex-start}
.art-row{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);text-decoration:none;align-items:baseline}
.art-row:hover b{color:var(--gold-ink)}
.art-row b{font-family:var(--mono);font-size:12.5px;font-weight:500}
.art-row span{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media (max-width:560px){.art-row{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
.hgroup{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 4px}
.loading{padding:60px 0;color:var(--ink-3);font-family:var(--mono);font-size:13px}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 2.4s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>
